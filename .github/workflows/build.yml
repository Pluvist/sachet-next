name: Xachet Android checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: 'false'
      - name: Install native Android toolchain
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Build native test APK and run application tests
        run: bash native/gradlew -p native :app:assembleDebug :app:testDebugUnitTest --max-workers=2 --console=plain
      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: xachet-native-test-${{ github.sha }}
          path: native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
