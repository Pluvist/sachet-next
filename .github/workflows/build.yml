name: Sachet Next Android checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SACHET_LOCAL_TEST: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter 3.24.5
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: '3.24.5'
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build ARM64 test APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: sachet-next-arm64-test-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error